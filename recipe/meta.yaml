{% set name = "sos-matlab" %}
{% set version = "0.20.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2e38311b87649be27338e8e59a8c29bdd58072237cee4fc0f33d700d0e8372c4

build:
  noarch: python
  number: 1
  script:
    - python -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - sos-notebook >=0.23.2
    - scipy
    - numpy
    - pandas
    - python >={{ python_min }}

outputs:
  - name: sos-matlab
    build:
      noarch: python
    test:
      requires:
        - python {{ python_min }}
      imports:
        - sos_matlab
  - name: sos-octave
    build:
      noarch: python
    requirements:
      run:
        - {{ pin_subpackage('sos-matlab', exact=True) }}
        - octave
        - octave_kernel
    test:
      requires:
        - nose
        - pytest
        - selenium
        - jupyter_contrib_nbextensions >=0.5.1
        - python {{ python_min }}
      imports:
        - sos_matlab
      commands:
        - python test_octave.py
      files:
        - test_octave.py

about:
  home: https://github.com/vatlab/sos-matlab
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: SoS language module for MATLAB and Octave
  doc_url: https://vatlab.github.io/sos-docs/
  dev_url: https://github.com/vatlab/sos-matlab

extra:
  recipe-maintainers:
    - BoPeng
